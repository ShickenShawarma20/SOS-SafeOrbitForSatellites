<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ground Stations · SOS SafeOrbitForSattelites</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/components.css">
<link rel="stylesheet" href="css/screens.css">
<style>
  .gs-map { position: relative; border-radius: var(--radius-lg); overflow: hidden; background: #060D18; border: 1px solid var(--border); }
  .gs-map svg { display: block; width: 100%; height: auto; }
  .station-marker { cursor: pointer; transition: transform .15s; }
  .station-marker:hover { transform: scale(1.3); }
  .gs-stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; }
  .gs-stat { background: var(--panel-2); border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 14px 16px; }
  .gs-stat .k { font-size: 10px; color: var(--text-mid); text-transform: uppercase; letter-spacing: .09em; }
  .gs-stat .v { font-family: var(--mono); font-size: 22px; font-weight: 700; margin-top: 4px; }
  .gs-stat .v.green { color: var(--nominal); }
  .gs-stat .v.red { color: var(--crit); }
  .gs-stat .v.blue { color: var(--accent); }
  .gs-table { width: 100%; border-collapse: collapse; font-size: 12.5px; }
  .gs-table th { text-align: left; padding: 9px 14px; font-size: 10px; color: var(--text-mid); text-transform: uppercase; letter-spacing: .08em; border-bottom: 1px solid var(--border); }
  .gs-table td { padding: 10px 14px; border-bottom: 1px solid var(--border); }
  .gs-table tr:last-child td { border-bottom: none; }
  .gs-table tr:hover td { background: rgba(56,189,248,.04); }
  .status-dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 8px; }
  .status-dot.on { background: var(--nominal); box-shadow: 0 0 8px rgba(34,197,94,.7); }
  .status-dot.off { background: var(--crit); }
</style>
</head>
<body data-page="groundstations">
<div class="shell" id="shell">
  <main class="page">

    <section class="page-head">
      <div>
        <div class="crumb">Network / Ground Station Coverage</div>
        <h1>GROUND STATIONS</h1>
        <div class="card-sub" style="margin-top:5px;">Global tracking network \u00B7 real-time satellite coverage</div>
      </div>
      <div class="page-head-actions">
        <button class="btn btn-sm on f-chip" data-filter="all">ALL</button>
        <button class="btn btn-sm f-chip" data-filter="online">ONLINE</button>
        <button class="btn btn-sm f-chip" data-filter="offline">OFFLINE</button>
      </div>
    </section>

    <!-- Network status stats -->
    <section class="gs-stats" style="margin-bottom:14px;">
      <article class="gs-stat"><div class="k">Stations Online</div><div class="v green" id="gsOnline">--</div></article>
      <article class="gs-stat"><div class="k">Stations Offline</div><div class="v red" id="gsOffline">--</div></article>
      <article class="gs-stat"><div class="k">Global Coverage</div><div class="v blue" id="gsCoverage">--</div></article>
      <article class="gs-stat"><div class="k">Avg. Latency</div><div class="v" id="gsLatency">--</div></article>
      <article class="gs-stat"><div class="k">Total Stations</div><div class="v" id="gsTotal">--</div></article>
    </section>

    <!-- Coverage map + station list -->
    <section class="two-col" style="grid-template-columns: minmax(0,1.6fr) minmax(0,1fr);">

      <article class="card">
        <div class="card-head">
          <span class="card-title">Coverage Map</span>
          <span class="live-dot" style="margin-left:auto;">NETWORK</span>
        </div>
        <div class="gs-map">
          <svg id="gsMapSvg" viewBox="0 0 720 360" role="img" aria-label="World map showing ground station locations">
            <defs>
              <radialGradient id="glow" cx="50%" cy="50%" r="50%"><stop offset="0%" stop-color="rgba(56,189,248,.35)"/><stop offset="100%" stop-color="rgba(56,189,248,0)"/></radialGradient>
              <radialGradient id="glowRed" cx="50%" cy="50%" r="50%"><stop offset="0%" stop-color="rgba(239,68,68,.3)"/><stop offset="100%" stop-color="rgba(239,68,68,0)"/></radialGradient>
            </defs>
            <g class="graticule" stroke="rgba(120,170,220,.1)" stroke-width="0.5">
              <line x1="0" y1="90" x2="720" y2="90"/><line x1="0" y1="180" x2="720" y2="180"/><line x1="0" y1="270" x2="720" y2="270"/>
              <line x1="120" y1="0" x2="120" y2="360"/><line x1="240" y1="0" x2="240" y2="360"/><line x1="360" y1="0" x2="360" y2="360"/><line x1="480" y1="0" x2="480" y2="360"/><line x1="600" y1="0" x2="600" y2="360"/>
              <ellipse cx="360" cy="180" rx="360" ry="180" fill="none"/>
            </g>
            <g class="land" fill="rgba(40,80,120,.25)" stroke="rgba(80,140,200,.15)" stroke-width="0.5">
              <path d="M60 62 Q100 38 165 46 Q215 40 232 66 Q250 84 228 104 Q238 128 214 140 L196 168 Q178 176 166 158 Q136 148 118 122 Q76 108 60 84 Z"/>
              <path d="M212 190 Q244 178 258 204 Q268 236 252 272 Q240 310 222 314 Q206 296 208 262 Q198 224 212 190 Z"/>
              <path d="M332 60 Q360 42 396 54 Q412 68 396 86 Q372 98 348 92 Q330 80 332 60 Z"/>
              <path d="M330 118 Q380 104 416 124 Q438 152 424 192 Q408 240 384 262 Q362 268 350 236 Q330 196 326 156 Z"/>
              <path d="M420 52 Q480 28 560 44 Q622 52 636 84 Q648 116 606 132 Q560 150 512 138 Q462 144 436 118 Q414 84 420 52 Z"/>
              <path d="M560 218 Q606 202 646 222 Q664 244 644 264 Q606 280 572 266 Q550 244 560 218 Z"/>
            </g>
            <g id="gsMarkers"></g>
          </svg>
        </div>
      </article>

      <article class="card">
        <div class="card-head">
          <span class="card-title">Station Registry</span>
          <span class="card-sub" style="margin-left:auto;" id="gsCount">-- stations</span>
        </div>
        <div style="overflow-x:auto; max-height:440px; overflow-y:auto;">
          <table class="gs-table">
            <thead><tr><th>Station</th><th>Lat</th><th>Lon</th><th>Status</th></tr></thead>
            <tbody id="gsTableBody"></tbody>
          </table>
        </div>
      </article>

    </section>

  </main>
</div>

<script src="js/api.js"></script>
<script src="js/shell.js"></script>
<script src="js/app.js"></script>
<script src="js/pages/groundstations.js"></script>
</body>
</html>
