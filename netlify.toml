[build]
  publish = "public"
  command = "echo 'Static site — no build step needed'"

[functions]
  directory = "netlify/functions"

[[headers]]
  for = "/css/*"
  [headers.values]
    Cache-Control = "public, max-age=86400"

[[headers]]
  for = "/js/*"
  [headers.values]
    Cache-Control = "public, max-age=86400"

# --- API function redirects (status 200 = rewrite, function receives original path) ---

[[redirects]]
  from = "/api/v1/debris"
  to = "/.netlify/functions/debris"
  status = 200

[[redirects]]
  from = "/api/v1/debris/*"
  to = "/.netlify/functions/debris"
  status = 200

[[redirects]]
  from = "/api/v1/tracking/fleet"
  to = "/.netlify/functions/tracking-fleet"
  status = 200

[[redirects]]
  from = "/api/v1/tracking/status"
  to = "/.netlify/functions/tracking-status"
  status = 200

# Catch-all: everything else → api.js mock handler
[[redirects]]
  from = "/api/v1/*"
  to = "/.netlify/functions/api"
  status = 200

# --- SPA clean-URL rewrites (for browser navigation) ---

